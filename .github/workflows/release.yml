name: Cross-Platform Build & Release

on:
  push:
    tags:
      - 'v*' # El flujo se dispara automáticamente al crear un tag (ej. v1.0.0)

permissions:
  contents: write # Permiso necesario para adjuntar los binarios al Release

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: OSV_Threat_Auditor
            asset_name: OSV_Threat_Auditor-Linux
          - os: windows-latest
            binary_name: OSV_Threat_Auditor.exe
            asset_name: OSV_Threat_Auditor-Windows.exe
          - os: macos-latest
            binary_name: OSV_Threat_Auditor
            asset_name: OSV_Threat_Auditor-macOS

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests packaging

      - name: Build with PyInstaller
        run: pyinstaller auditor.spec --clean

      - name: Rename Binary for Clarity
        run: mv dist/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
        shell: bash

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
